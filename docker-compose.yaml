  postgres:
    image: postgres:18-alpine3.21
    restart: always
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      #- ./data24/postgres:/var/lib/postgresql/data
      - ./all_databases.sql:/docker-entrypoint-initdb.d/all_databases.sql
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: keycloak
    restart: always
    ports:
      - "8080:8080"
    #volumes:
    #  - ./data/keycloak:/opt/keycloak/data
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${DB_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DB_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: ${KEYCLOAK_DB_URL}
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
    command:
      - start-dev
    depends_on:
      - postgres
